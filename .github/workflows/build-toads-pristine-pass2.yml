name: Build Toads Pristine Pass 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-toads-pristine-pass2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check gdown

      - name: Download raw Toads review chunks only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw src seg out
          get(){ gdown --id "$1" -O "raw/$2"; }
          get '19xuiswZ1xAZcSF0D_Ov7EmWFfgKhGk6y' 'DJI_20260904193326_0001_D_CHUNK_00.mp4'
          get '1t7_R0GIe921d49R5PeGczQGxwfIPifTN' 'DJI_20260904193326_0001_D_CHUNK_01.mp4'
          get '1wSNQoCt9qofuQuWSIWh1V3XjNB-_lVqp' 'DJI_20260904193326_0001_D_CHUNK_02.mp4'
          get '1E5ANkHJ4JK1afo3ULP752MEa2GKU6Zl8' 'DJI_20260904193420_0002_D_CHUNK_00.mp4'
          get '1MxvSmFVEq-M0tRL7gP-gbVVcmYWoqHdt' 'DJI_20260904193420_0002_D_CHUNK_01.mp4'
          get '1cZiJQgwrw_mvw8tsClN-ZwrMwNooWH2J' 'DJI_20260904193911_0003_D_CHUNK_00.mp4'
          get '1BeVCXTdM4NDIKqjZEjI56tYholXi91kB' 'DJI_20260904193911_0003_D_CHUNK_01.mp4'
          get '1CZ1Nus-_z4QC9tXSzHwK8MYnJgrWsa4E' 'DJI_20260904193911_0003_D_CHUNK_02.mp4'
          get '1jpW-SztaeDHEwP7jT6vn4wpDMBkVLO0Z' 'DJI_20260904194201_0004_D_CHUNK_00.mp4'
          get '1uae33HJfdEEcz5-5Wway4B0Exm6fc6O0' 'DJI_20260904194201_0004_D_CHUNK_01.mp4'
          get '1WNhW3tK9LLQZORoy03sc66P4N7FULvTd' 'DJI_20260904194201_0004_D_CHUNK_02.mp4'
          get '1b7efZoYv14vndc1h0K4i_RVeKavlBPm2' 'DJI_20260904194201_0004_D_CHUNK_03.mp4'
          get '1S5GGFsb9h97XjNPzxFVAJFrYikmtKjSb' 'DJI_20260904194201_0004_D_CHUNK_04.mp4'

      - name: Reconstruct source continuity
        shell: bash
        run: |
          set -euo pipefail
          printf "file '%s'\n" "$PWD/raw/DJI_20260904193326_0001_D_CHUNK_00.mp4" "$PWD/raw/DJI_20260904193326_0001_D_CHUNK_01.mp4" "$PWD/raw/DJI_20260904193326_0001_D_CHUNK_02.mp4" > 0001.txt
          printf "file '%s'\n" "$PWD/raw/DJI_20260904193420_0002_D_CHUNK_00.mp4" "$PWD/raw/DJI_20260904193420_0002_D_CHUNK_01.mp4" > 0002.txt
          printf "file '%s'\n" "$PWD/raw/DJI_20260904193911_0003_D_CHUNK_00.mp4" "$PWD/raw/DJI_20260904193911_0003_D_CHUNK_01.mp4" "$PWD/raw/DJI_20260904193911_0003_D_CHUNK_02.mp4" > 0003.txt
          printf "file '%s'\n" "$PWD/raw/DJI_20260904194201_0004_D_CHUNK_00.mp4" "$PWD/raw/DJI_20260904194201_0004_D_CHUNK_01.mp4" "$PWD/raw/DJI_20260904194201_0004_D_CHUNK_02.mp4" "$PWD/raw/DJI_20260904194201_0004_D_CHUNK_03.mp4" "$PWD/raw/DJI_20260904194201_0004_D_CHUNK_04.mp4" > 0004.txt
          for n in 0001 0002 0003 0004; do ffmpeg -loglevel error -f concat -safe 0 -i "$n.txt" -c copy "src/$n.mp4" -y; done

      - name: Render pristine text-free selects sequentially
        shell: bash
        run: |
          set -euo pipefail
          render(){
            i="$1"; s="$2"; ss="$3"; d="$4"; x="$5"; sat="$6"
            ffmpeg -loglevel error -ss "$ss" -i "src/$s.mp4" -t "$d" \
              -vf "crop=1215:2160:${x}:0,scale=1080:1920:flags=lanczos,eq=contrast=1.045:saturation=${sat}:brightness=0.005,unsharp=5:5:0.30:5:5:0" \
              -af "highpass=f=35,acompressor=threshold=-18dB:ratio=2:attack=15:release=250" \
              -r 24000/1001 -c:v libx264 -preset veryfast -crf 16 -profile:v high -pix_fmt yuv420p \
              -c:a aac -b:a 192k -ar 48000 -movflags +faststart "seg/$i.mp4" -y
          }
          render 01 0002 0.0 3.8 300 1.055
          render 02 0003 0.0 5.5 1300 1.055
          render 03 0001 0.0 3.5 950 1.050
          render 04 0001 4.5 6.0 950 1.050
          render 05 0001 10.5 3.5 1200 1.050
          render 06 0004 0.0 5.5 1250 1.040
          render 07 0004 5.5 7.0 1350 1.040
          render 08 0004 14.5 6.0 1350 1.040
          render 09 0004 20.5 5.0 1450 1.040
          render 10 0003 5.5 3.85 1300 1.055
          render 11 0003 11.5 5.85 1300 1.055
          render 12 0002 3.8 4.5 1350 1.055

      - name: Assemble 60-second master and normalize audio
        shell: bash
        run: |
          set -euo pipefail
          : > concat.txt
          for f in $(find seg -maxdepth 1 -name '*.mp4' | sort); do echo "file '$PWD/$f'" >> concat.txt; done
          ffmpeg -loglevel error -f concat -safe 0 -i concat.txt -c copy pre_master.mp4 -y
          ffmpeg -loglevel error -i pre_master.mp4 -t 60 -map 0:v:0 -map 0:a:0 \
            -vf "setpts=PTS-STARTPTS" \
            -af "asetpts=PTS-STARTPTS,dynaudnorm=f=250:g=5:p=0.95,loudnorm=I=-14:TP=-1.5:LRA=10" \
            -r 24000/1001 -c:v libx264 -preset veryfast -crf 16 -profile:v high -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 -movflags +faststart \
            out/Session_Podcast_Toads_60s_EVENT_PROMO_PRISTINE_PASS2.mp4 -y

      - name: QC
        run: |
          set -euo pipefail
          ffmpeg -v error -i out/Session_Podcast_Toads_60s_EVENT_PROMO_PRISTINE_PASS2.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/Session_Podcast_Toads_60s_EVENT_PROMO_PRISTINE_PASS2.mp4

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: toads-pristine-pass2
          path: out/Session_Podcast_Toads_60s_EVENT_PROMO_PRISTINE_PASS2.mp4
          retention-days: 7
